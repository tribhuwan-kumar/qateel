[package]
name = "qateel"
edition = "2024"
version = "0.1.0"
readme = "../README.md"
authors = ["@tribhuwan-kumar"]
license = "GNU GENERAL PUBLIC LICENSE V3"
repository = "https://github.com/tribhuwan-kumar/qateel"
keywords = ["qateel", "aria2", "aria2-webui", "self-hosted", "server", "downloader", "utitly"]

[dependencies]
url = "2.5.7"
hex = "0.4.3"
dirs = "6.0.0"
open = "5.3.5"
rand = "0.9.2"
# dhat = "0.3.3"
toml = "1.1.2"
time = "0.3.44"
hmac = "0.13.0"
sha2 = "0.11.0"
sha1 = "0.11.0"
blake3 = "1.8.5"
dashmap = "6.2.1"
base64 = "0.22.1"
tracing = "0.1.43"
futures = "0.3.34"
schemars = "1.2.1"
anyhow = "1.0.100"
mimalloc = "0.1.52"
dotenvy = "0.15.7"
if-addrs = "0.14.0"
mime_guess = "2.0.5"
rust-embed = "8.9.0"
urlencoding = "2.1.3"
file-format = "0.29.0"
async-trait = "0.1.89"
serde_json = "1.0.145"
futures-util = "0.3.31"
serde_bencode = "0.2.4"
tracing-appender = "0.2.4"
notify-debouncer-full = "0.7.0"
argon2 = { version = "0.5.3", features = ["std"] }
ulid = { version = "1.2.1", features = ["serde"] }
tokio = { version = "1.48.0", features = ["full"] }
chrono = { version = "0.4.42", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
axum-extra = {version = "0.12.5", features = ["cookie"] }
axum = { version = "0.8.7", features = ["macros", "ws"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "local-time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6.8", features = ["fs", "cors", "trace", "set-header"] }
reqwest = { version = "0.13.3", default-features = false, features = ["default-tls", "json"] }
sqlx = { version = "0.8.6", features = [ "sqlite", "derive", "migrate", "macros", "runtime-tokio", "chrono" ] }

[[bin]]
name = "qateel"
path = "src/main.rs"

