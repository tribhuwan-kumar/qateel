<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Qateel extension settings</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      padding: 30px;
      background-color: #f9f9fa;
      color: #15141a;
    }
    .container {
      max-width: 500px;
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; font-size: 20px; }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #8f8f9d;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background-color: #0060df;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    button:hover { background-color: #00449e; }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #0060df;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Qateel Settings</h2>
    <div class="form-group">
      <label for="qateelAddress">Qateel Browser API Endpoint:</label>
      <input type="text" id="qateelAddress" placeholder="http://localhost:5173/api/aria2/add/uris">
    </div>
    <button id="save">Save Configuration</button>
    <div id="status" class="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
